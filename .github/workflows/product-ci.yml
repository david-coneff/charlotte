# charlotte PRODUCT CI — build only (the repo declares no test script).
# R15: governance runs in governance.yml against product + protocol + memory.
name: product-ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
