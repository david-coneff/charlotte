# charlotte PRODUCT CI — build, then the report regression suite (`npm test`).
# R15: governance runs in governance.yml against product + protocol + memory.
#
# Runs on BOTH branches of the two-branch model (rhiz-child-repo-convention.md#55):
# rhiz-working*, so real changes are validated before promotion, AND main, as the
# safety net that the PROMOTED (artifact-stripped) tree still builds — a real check
# that stripping never silently broke something, not just an assumption.
name: product-ci
on:
  push:
    # The glob is load-bearing: the protocol keys EVERY stream's working branch
    # (rhiz-working-<slug>) and grants no stream standing for being first, so an
    # exact-name filter silently stops triggering the moment a repo adopts one.
    branches: [main, "rhiz-working*", "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # crawl.js is a COMMITTED artifact generated from src/. The build above just rewrote it,
      # so a non-empty diff means the commit shipped a src/ change without rebuilding — which
      # `npm test` alone cannot catch, since the tests import src/ directly.
      - name: crawl.js is in sync with src/
        run: git diff --exit-code -- crawl.js
      # test/ drives the report's own client-side scripts (src/report/*) through jsdom.
      - run: npm test
