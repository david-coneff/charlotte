# charlotte GOVERNANCE pipeline — R15: rhizome governance runs OUTSIDE the product CI.
#
# Checks out three roots (product + protocol + charlotte-memory) and runs the
# mechanical maintenance loop against them. The product repo carries only a thin
# .rhiz-binding.json; its curated notes and baselines live in charlotte-memory, so
# this is the only pipeline that needs all three.
name: governance

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: charlotte

      # Where the protocol and memory live is READ FROM THE COMMITTED BINDING, never
      # written as a literal here (protocol-instance-split principle 3: a fork must be
      # swappable by editing config, not code — a hardcoded `owner/repo` makes this
      # workflow un-adoptable by anyone else). The binding is already on disk from the
      # checkout above, and `.rhiz-binding.json` is the designated home for a coordinate.
      - name: Resolve roots from the binding
        id: binding
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          b = json.load(open("charlotte/.rhiz-binding.json"))
          slug = lambda u: re.sub(r"^https?://[^/]+/|\.git$", "", u)
          print(f"protocol_repo={slug(b['protocol_url'])}")
          print(f"protocol_ref={b.get('protocol_ref', 'main')}")
          print(f"memory_repo={slug(b['memory_url'])}")
          print(f"memory_ref={b.get('memory_ref', 'main')}")
          PY

      # Both are PRIVATE, so these checkouts need a read credential: a
      # fine-grained PAT with read access, stored as RHIZOME_TOOLS_TOKEN.
      - name: Check out rhizome-protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.binding.outputs.protocol_repo }}
          ref: ${{ steps.binding.outputs.protocol_ref }}
          path: rhizome-protocol
          token: ${{ secrets.RHIZOME_TOOLS_TOKEN || github.token }}

      - name: Check out charlotte-memory
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.binding.outputs.memory_repo }}
          ref: ${{ steps.binding.outputs.memory_ref }}
          path: charlotte-memory
          token: ${{ secrets.RHIZOME_TOOLS_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Protocol pin drift-guard
        working-directory: charlotte
        run: |
          PINNED=$(python3 -c "import json;print(json.load(open('.rhiz-binding.json'))['protocol_sha'])")
          REF=$(python3 -c "import json;print(json.load(open('.rhiz-binding.json')).get('protocol_ref','main'))")
          ACTUAL=$(git -C ../rhizome-protocol rev-parse HEAD)
          # Name the ref we ACTUALLY track, not a literal. This said "lags main" while the
          # binding pinned main, and stayed saying it after the fleet moved to tools-stable
          # — a guard reporting drift against a branch it no longer follows.
          if [ "$PINNED" != "$ACTUAL" ]; then
            echo "::notice::protocol pin $PINNED lags $REF $ACTUAL — bump .rhiz-binding.json when ready"
          fi

      - name: Mechanical maintenance (multi-root)
        working-directory: charlotte
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
          RHIZ_MEMORY_PATH: ${{ github.workspace }}/charlotte-memory
        run: python3 tools/rhiz.py maintain

      # The memory repo lints on ITS OWN root — rhiz-lint stays product-local and
      # never reaches across a repo boundary, so a clone without the sibling is not
      # silently under-governed (EL-152). Reuses the checkout above rather than
      # adding a workflow to charlotte-memory. Its .rhiz-lint.json declares
      # knowledge_roots ["."], which is what this invocation expects.
      - name: Lint charlotte-memory on its own root
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
        run: python3 rhizome-protocol/tools/rhiz-lint.py --root charlotte-memory

      # MERKLE INTEGRITY over the memory sibling — the hole this pipeline had.
      # doc-graph is product-local like rhiz-lint: a `--root charlotte` walk cannot
      # reach a sibling directory, so `rhiz maintain` (which now verifies partitions)
      # still cannot see charlotte-memory's. Measured 2026-08-15: aether-memory carried 32
      # sections whose stored content-hash did not match their body — scrubbed for
      # shareability during Phase 3 and never re-hashed — and NOTHING in the fleet
      # was watching, because verify ran in exactly two repos' workflows and neither
      # was a child. A memory sibling gets its gates from the PRODUCT's pipeline, the
      # same way its lint and scope-audit already do.
      - name: Merkle verify charlotte-memory's partitions
        run: |
          set -e
          found=0
          for idx in $(find charlotte-memory -name '*_index.json' -not -path '*/.rhiz-tools/*'); do
            if python3 -c "import json,sys; sys.exit(0 if 'sections' in json.load(open('$idx')) else 1)"; then
              found=1
              python3 rhizome-protocol/protocol/modules/rhiz-merkle/tools/doc-graph.py verify "$idx"
            fi
          done
          [ "$found" = 1 ] && echo "charlotte-memory: all partitions verified" \
                           || echo "::notice::charlotte-memory declares no doc-graph partitions — nothing to verify"

      # The reference half of the same boundary: lint validates charlotte-memory
      # INTERNALLY, this validates what it says about OTHER repos — protocol
      # paths against the live protocol tree, and `<repo>:<path>` coordinates
      # against whichever siblings this workflow checked out. Coordinates naming
      # a repo that is not checked out are SKIPPED, not failed, so the verdict
      # does not depend on which repos a given job happens to clone.
      - name: Cross-repo reference check on charlotte-memory
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
        run: |
          python3 rhizome-protocol/tools/rhiz-lint.py \
            --root rhizome-protocol --cross-repo charlotte-memory

      - name: Shareability gate on charlotte-memory
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
        run: |
          # The PRODUCT root, audited first. Path is the checkout dir, not `.`:
          # this step has no working-directory, so it runs from the workspace. This is where the coordinate leaks
          # actually were — all 8 children hardcoded the protocol repo in this
          # very file — and until now no pipeline anywhere scanned a product
          # root, so the principle-3 guard was pointed away from its target.
          python3 rhizome-protocol/tools/rhiz_scope_audit.py --root charlotte
          python3 rhizome-protocol/tools/rhiz_scope_audit.py --root charlotte-memory
          if find charlotte-memory -type f ! -path '*/.git/*' \
               | grep -iE '\.(png|jpg|jpeg|gif|webp|wasm|zip|bin|mp4|webm|pdf)$'; then
            echo "::error::blob found in the shareable notes repo — must live in a private -lfs"
            exit 1
          fi
